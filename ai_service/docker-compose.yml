# Docker Compose for DocuLearn AI Service
# Uses cloud databases (Neon PostgreSQL + MongoDB Atlas)
# Local containers only for development/testing

services:
  ai_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_service
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

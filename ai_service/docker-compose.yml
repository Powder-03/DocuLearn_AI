services:
  db:
    image: postgres:15-alpine
    container_name: learning_saas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doculearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doculearn_pass}
      POSTGRES_DB: ${POSTGRES_DB:-doculearn_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - doculearn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doculearn}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: learning_saas_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-doculearn}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-doculearn_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-doculearn_chats}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - doculearn-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  ai_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-doculearn}:${POSTGRES_PASSWORD:-doculearn_pass}@db:5432/${POSTGRES_DB:-doculearn_db}
      - MONGODB_URL=mongodb://${MONGO_USER:-doculearn}:${MONGO_PASSWORD:-doculearn_pass}@mongodb:27017/${MONGO_DB:-doculearn_chats}?authSource=admin
    networks:
      - doculearn-network
    volumes:
      - ./app:/app/app

networks:
  doculearn-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:

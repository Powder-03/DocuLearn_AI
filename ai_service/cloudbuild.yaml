# Google Cloud Build configuration for DocuLearn AI Service

steps:
  # Step 1: Install Python dependencies required for the database migration step.
  - name: 'python:3.11-slim'
    entrypoint: 'pip'
    args: ['install', '-r', 'requirements.txt', '--user']
    id: 'Install Dependencies'

  # Step 2: Run database migrations using Alembic.
  # This step securely accesses the DATABASE_URL from Google Secret Manager.
  - name: 'python:3.11-slim'
    entrypoint: 'python'
    args: ['-m', 'alembic', 'upgrade', 'head']
    secretEnv: ['DATABASE_URL']
    waitFor: ['Install Dependencies']
    id: 'Run Migrations'

  # Step 3: Build the container image.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:latest'
      - '.'
    waitFor: ['Run Migrations']
    id: 'Build Image'

  # Step 4: Deploy the container image to Cloud Run.
  # This step uses the gcloud CLI to deploy the image built in the previous step.
  # It also configures the service with the necessary secrets and environment variables.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--update-secrets=DATABASE_URL=doculearn-database-url:latest,MONGODB_URL=doculearn-mongodb-url:latest,GOOGLE_API_KEY=doculearn-google-api-key:latest'
      - '--set-env-vars'
      - 'PLANNING_LLM_MODEL=${_PLANNING_LLM_MODEL},TUTORING_LLM_MODEL=${_TUTORING_LLM_MODEL}'

# Push the container image to Google Artifact Registry upon a successful build.
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:latest'

# Make the DATABASE_URL secret available to the build steps.
availableSecrets:
  secretManager:
    - versionName: 'projects/${PROJECT_ID}/secrets/doculearn-database-url/versions/latest'
      env: 'DATABASE_URL'

# Default values for substitution variables.
substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'doculearn-repo'
  _IMAGE_NAME: 'doculearn-ai'
  _SERVICE_NAME: 'doculearn-ai-service'
  _PLANNING_LLM_MODEL: 'gemini-2.5-pro'
  _TUTORING_LLM_MODEL: 'gemini-2.5-flash'

options:
  logging: CLOUD_LOGGING_ONLY
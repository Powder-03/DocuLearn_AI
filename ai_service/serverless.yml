service: doculearn-ai

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11 # This is for information; the Docker image defines the actual runtime
  region: us-east-1 # Change to your preferred region
  ecr:
    images:
      doculearn-app:
        path: ./
        file: Dockerfile.lambda
  environment:
    # --- IMPORTANT ---
    # Add all your environment variables from .env here
    # Do not deploy the .env file
    DATABASE_URL: ${env:DATABASE_URL}
    MONGODB_URL: ${env:MONGODB_URL}
    GOOGLE_API_KEY: ${env:GOOGLE_API_KEY}
    MONGO_DB: ${env:MONGO_DB}
    PLANNING_LLM_PROVIDER: "google"
    PLANNING_LLM_MODEL: "gemini-2.5-pro"
    TUTORING_LLM_PROVIDER: "google"
    TUTORING_LLM_MODEL: "gemini-2.5-pro"

functions:
  api:
    # This now points to the ECR image defined above
    image:
      name: doculearn-app
    events:
      - httpApi: '*' # Creates an API Gateway that proxies all requests to the function

plugins:
  - serverless-python-requirements
  - serverless-wsgi # This might not be needed for image-based deployments but is kept for safety
  
custom:
  pythonRequirements:
    dockerizePip: true
    zip: false # Important: We are not creating a zip file
service: doculearn-ai

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  memorySize: 1024
  timeout: 30
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    MONGODB_URL: ${env:MONGODB_URL}
    GROQ_API_KEY: ${env:GROQ_API_KEY}
    MONGO_DB: learning_saas_chats
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

functions:
  api:
    handler: lambda_handler.handler
    events:
      - httpApi: '*'
    layers:
      - arn:aws:lambda:us-east-1:770693421928:layer:Klayers-p311-fastapi:1

package:
  exclude:
    - .git/**
    - .vscode/**
    - __pycache__/**
    - node_modules/**
    - .env.example
    - README.md
    - docker-compose.yml
    - Dockerfile
    - alembic/**
    - tests/**

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    layer: true
    slim: true
    strip: false
    zip: true
